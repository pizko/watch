# Копия на pizko.github.io/watch собирается отдельно, в режиме preview:
# noindex на всех страницах, без Метрики, пустой sitemap.
# Файлы в main остаются боевыми — их выкладывают на часовое-ателье.рф.
name: Preview на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Режим preview
        run: |
          python3 - <<'EOF'
          import json
          p = 'data/site.json'
          d = json.load(open(p, encoding='utf-8'))
          d['environment'] = 'preview'
          open(p, 'w', encoding='utf-8').write(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
          EOF
      - run: python3 build_site.py
      - run: python3 tools/verify.py
      - run: node --check assets/js/main.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
